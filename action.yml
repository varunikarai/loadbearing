name: Loadbearing probe
description: >-
  Find the inputs your pipeline claims to use but never reads, and the ones it
  should ignore but reacts to, by running it. Writes a job summary and fails
  the job when it finds a defect.
branding:
  icon: git-branch
  color: green
inputs:
  target:
    description: Path to the target.json describing the pipeline
    required: true
  args:
    description: Extra probe flags, e.g. "--baseline-runs 5" or "--backend sandbox --nano"
    required: false
    default: ""
  fail-on-defects:
    description: Fail the job when a defect is found ("true" or "false")
    required: false
    default: "true"
outputs:
  defects:
    description: Number of defective fields found
    value: ${{ steps.probe.outputs.defects }}
  report:
    description: Path of the JSON report
    value: ${{ steps.probe.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Loadbearing
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"
    - name: Probe
      id: probe
      shell: bash
      # Inputs arrive as environment variables, never pasted into the script,
      # so a crafted input cannot inject shell commands.
      env:
        LB_TARGET: ${{ inputs.target }}
        LB_ARGS: ${{ inputs.args }}
        LB_FAIL: ${{ inputs.fail-on-defects }}
      run: |
        set +e
        read -r -a extra <<< "$LB_ARGS"
        loadbearing probe "$LB_TARGET" "${extra[@]}" \
          --out loadbearing-report.json --html loadbearing-report.html \
          --markdown "$GITHUB_STEP_SUMMARY"
        code=$?
        set -e
        if [ "$code" -gt 1 ]; then echo "loadbearing failed to run (exit $code)"; exit "$code"; fi
        defects=$(python -c "import json;print(len(json.load(open('loadbearing-report.json'))['defects']))")
        echo "defects=$defects" >> "$GITHUB_OUTPUT"
        echo "report=loadbearing-report.json" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 1 ] && [ "$LB_FAIL" = "true" ]; then
          echo "::error::Loadbearing found $defects defective input(s). See the job summary."
          exit 1
        fi
