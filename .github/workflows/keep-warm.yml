name: keep-warm

# A free host sleeps when idle; a visitor would wait a minute for it to wake.
# Every 10 minutes this pings the demo's health check. Set the repository
# variable DEMO_URL (Settings > Secrets and variables > Actions > Variables)
# to the demo's address; until then the job does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then echo "DEMO_URL is not set; nothing to ping"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "$DEMO_URL/healthz"
